[package]
name = "brz-http-server"
version = "0.0.7"
edition = "2024"
rust-version = "1.85"
description = "Zero-copy HTTP/1.1 server runtime for Breeze services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/http-server"

[workspace]
members = ["macros"]
resolver = "3"

[dependencies]
brz-metrics = { package = "brz-metrics", version = "0.0.3" }
brz-io = { package = "brz-io", version = "0.0.2" }
brz-json = { package = "brz-json", version = "0.0.2" }
brz-ds = { package = "brz-ds", version = "0.0.2", default-features = false }
bytes = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
httparse = "1"
http-server-macros = { path = "macros", version = "=0.0.7", optional = true, package = "brz-http-server-macros" }
itoa = "1"
inventory = { version = "0.3", optional = true }
multer = "3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.4"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[features]
default = []
macros = ["dep:http-server-macros", "dep:inventory"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[bench]]
name = "router"
harness = false
required-features = ["macros"]

[lib]
name = "brz_http_server"
